<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مخلوقات حية أم أشياء غير حية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#7fd4f0;
    --sky-bottom:#fff3cf;
    --ink:#2d3047;
    --living:#2e9e5b;
    --living-dark:#1f7a44;
    --living-light:#e3f7ea;
    --nonliving:#ff8c42;
    --nonliving-dark:#dd6f22;
    --nonliving-light:#fff0e2;
    --card:#ffffff;
    --shadow: 0 10px 0 rgba(45,48,71,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Cairo', sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, #bdeaf7 35%, var(--sky-bottom) 100%);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:22px 14px 60px;
    overflow-x:hidden;
    position:relative;
  }

  /* decorative floating clouds */
  .cloud{
    position:absolute;
    background:#fff;
    border-radius:50px;
    opacity:.85;
    filter:blur(0.3px);
  }
  .cloud::before, .cloud::after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:50%;
  }

  h1.title{
    font-family:'Baloo Bhaijaan 2', sans-serif;
    font-weight:800;
    font-size:clamp(26px, 4.6vw, 46px);
    text-align:center;
    margin:6px 0 4px;
    color:var(--ink);
    text-shadow:
      3px 3px 0 #ffd166,
      -1px -1px 0 rgba(255,255,255,0.6);
    letter-spacing:0.5px;
    z-index:2;
  }
  p.subtitle{
    font-size:clamp(14px,2vw,18px);
    color:#4a4e6b;
    margin:0 0 18px;
    text-align:center;
    font-weight:600;
    z-index:2;
  }

  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    padding:8px 18px;
    border-radius:999px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
    z-index:2;
    font-weight:700;
    font-size:15px;
  }
  .progress-track{
    width:150px;
    height:12px;
    background:#eee6d5;
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ffd166,#ff8c42);
    border-radius:999px;
    transition:width .4s ease;
  }
  .stars{font-size:16px;}

  .scene-card{
    position:relative;
    width:min(880px, 96vw);
    background:var(--card);
    border-radius:28px;
    padding:14px;
    box-shadow:var(--shadow);
    border:5px solid #fff;
    outline:3px dashed #ffd166;
    outline-offset:-14px;
    z-index:2;
  }
  .scene-frame{
    position:relative;
    width:100%;
    aspect-ratio: 1170 / 896;
    border-radius:18px;
    overflow:hidden;
  }
  .scene-frame img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  .hotspot{
    position:absolute;
    transform:translate(-50%,-50%);
    width:52px;
    height:52px;
    border-radius:50%;
    background:rgba(255,255,255,0.55);
    border:3px solid #ffffff;
    box-shadow:0 4px 10px rgba(0,0,0,0.18), 0 0 0 4px rgba(255,209,102,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    cursor:grab;
    touch-action:none;
    animation: pulse 1.8s ease-in-out infinite;
    z-index:5;
  }
  .hotspot.collected{
    display:none;
  }
  .hotspot.dragging{
    animation:none;
    cursor:grabbing;
    box-shadow:0 8px 18px rgba(0,0,0,0.3);
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 4px 10px rgba(0,0,0,0.18), 0 0 0 4px rgba(255,209,102,0.55); }
    50%{ box-shadow:0 4px 10px rgba(0,0,0,0.18), 0 0 0 9px rgba(255,209,102,0.15); }
  }

  .ghost{
    position:fixed;
    width:58px;
    height:58px;
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    border:3px solid #ffd166;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    pointer-events:none;
    z-index:999;
    transform:translate(-50%,-50%) scale(1.05);
  }

  .zones{
    display:flex;
    gap:18px;
    width:min(880px, 96vw);
    margin-top:22px;
    z-index:2;
    flex-wrap:wrap;
  }
  .zone{
    flex:1 1 260px;
    min-height:150px;
    border-radius:22px;
    padding:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:var(--shadow);
    border:4px dashed transparent;
  }
  .zone-living{
    background:var(--living-light);
    border-color:var(--living);
  }
  .zone-nonliving{
    background:var(--nonliving-light);
    border-color:var(--nonliving);
  }
  .zone.hover{
    transform:scale(1.03);
  }
  .zone-living.hover{ box-shadow:0 0 0 6px rgba(46,158,91,0.35), var(--shadow); }
  .zone-nonliving.hover{ box-shadow:0 0 0 6px rgba(255,140,66,0.35), var(--shadow); }

  .zone-icon{ font-size:34px; margin-bottom:4px; }
  .zone h2{
    font-family:'Baloo Bhaijaan 2', sans-serif;
    font-size:clamp(18px,2.4vw,24px);
    margin:0 0 10px;
  }
  .zone-living h2{ color:var(--living-dark); }
  .zone-nonliving h2{ color:var(--nonliving-dark); }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    width:100%;
  }
  .chip{
    background:#fff;
    border-radius:999px;
    padding:6px 12px;
    font-size:14px;
    font-weight:700;
    box-shadow:0 3px 0 rgba(0,0,0,0.08);
    display:flex;
    align-items:center;
    gap:6px;
    animation: pop .35s ease;
  }
  @keyframes pop{
    0%{ transform:scale(0); opacity:0; }
    70%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); }
  }

  .shake{ animation: shakeAnim .45s ease; }
  @keyframes shakeAnim{
    0%,100%{ transform:translate(-50%,-50%) rotate(0deg); }
    20%{ transform:translate(-60%,-50%) rotate(-8deg); }
    40%{ transform:translate(-40%,-50%) rotate(8deg); }
    60%{ transform:translate(-58%,-50%) rotate(-6deg); }
    80%{ transform:translate(-42%,-50%) rotate(6deg); }
  }

  .toast{
    position:fixed;
    left:50%;
    top:14px;
    transform:translateX(-50%) translateY(-60px);
    background:var(--ink);
    color:#fff;
    padding:10px 22px;
    border-radius:999px;
    font-weight:700;
    font-size:15px;
    z-index:1000;
    transition:transform .3s ease;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
  .toast.good{ background:var(--living-dark); }
  .toast.bad{ background:#d1495b; }

  canvas#confetti-canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:998;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(45,48,71,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1001;
    padding:20px;
  }
  .overlay.show{ display:flex; }
  .overlay-card{
    background:#fff;
    border-radius:28px;
    padding:36px 30px;
    max-width:420px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    border:5px solid #ffd166;
    animation:pop .4s ease;
  }
  .overlay-card .trophy{ font-size:64px; margin-bottom:10px; }
  .overlay-card h2{
    font-family:'Baloo Bhaijaan 2', sans-serif;
    font-size:28px;
    color:var(--ink);
    margin:0 0 10px;
  }
  .overlay-card p{
    font-size:16px;
    color:#555;
    margin:0 0 22px;
    font-weight:600;
  }
  .restart-btn{
    background:linear-gradient(180deg,#ffd166,#ff8c42);
    border:none;
    color:#fff;
    font-family:'Baloo Bhaijaan 2', sans-serif;
    font-weight:700;
    font-size:18px;
    padding:12px 30px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 6px 0 #dd6f22;
    transition:transform .1s ease;
  }
  .restart-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #dd6f22; }

  @media (max-width:520px){
    .hotspot{ width:42px; height:42px; font-size:20px; }
  }
</style>
</head>

  <div class="zone zone-living" id="zoneLiving" data-type="living">

  </div>
  <div class="zone zone-nonliving" id="zoneNonliving" data-type="nonliving">

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="trophy">🏆</div>
    <h2>لقد أكملت اللعبة يا بطل!</h2>
    <p>حاول مرة أخرى</p>
    <button class="restart-btn" id="restartBtn">العب مرة أخرى</button>
  </div>
</div>

<script>
(function(){
  const totalItems = document.querySelectorAll('.hotspot').length;
  let collected = 0;
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const toastEl = document.getElementById('toast');
  const overlay = document.getElementById('overlay');
  const zoneLiving = document.getElementById('zoneLiving');
  const zoneNonliving = document.getElementById('zoneNonliving');
  const chipsLiving = document.getElementById('chipsLiving');
  const chipsNonliving = document.getElementById('chipsNonliving');

  /* ---------------- Audio (Web Audio API synthesized) ---------------- */
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playClapBurst(){
    const ctx = ensureAudio();
    const now = ctx.currentTime;
    const claps = 10;
    for(let i=0;i<claps;i++){
      const t = now + i*0.045 + Math.random()*0.02;
      const bufferSize = ctx.sampleRate * 0.06;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<bufferSize;j++){
        data[j] = (Math.random()*2-1) * Math.pow(1 - j/bufferSize, 2);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const bandpass = ctx.createBiquadFilter();
      bandpass.type = 'bandpass';
      bandpass.frequency.value = 1500 + Math.random()*800;
      bandpass.Q.value = 0.8;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.08);
      noise.connect(bandpass).connect(gain).connect(ctx.destination);
      noise.start(t);
      noise.stop(t+0.09);
    }
  }

  function playCheerChime(){
    const ctx = ensureAudio();
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach((freq, i)=>{
      const t = now + i*0.09;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.28, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t+0.4);
    });
  }

  function playErrorSound(){
    const ctx = ensureAudio();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(110, now+0.28);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now+0.3);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now+0.32);
  }

  function playCorrectSound(){
    playClapBurst();
    playCheerChime();
  }

  /* ---------------- Confetti ---------------- */
  const canvas = document.getElementById('confetti-canvas');
  const cctx = canvas.getContext('2d');
  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let confettiParticles = [];
  const confettiColors = ['#ff8c42','#ffd166','#2e9e5b','#5b7db1','#e94f64','#8e6cf0'];

  function burstConfetti(originX, originY){
    const count = 90;
    for(let i=0;i<count;i++){
      confettiParticles.push({
        x: originX,
        y: originY,
        vx: (Math.random()-0.5)*9,
        vy: (Math.random()*-9)-3,
        size: 6+Math.random()*6,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        rot: Math.random()*Math.PI*2,
        vrot: (Math.random()-0.5)*0.3,
        life: 0,
        maxLife: 90+Math.random()*30,
        shape: Math.random()>0.5 ? 'rect':'circle'
      });
    }
    if(!confettiRunning){ confettiRunning = true; animateConfetti(); }
  }

  let confettiRunning = false;
  function animateConfetti(){
    cctx.clearRect(0,0,canvas.width,canvas.height);
    confettiParticles.forEach(p=>{
      p.vy += 0.22;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      p.life++;
      const alpha = Math.max(0, 1 - p.life/p.maxLife);
      cctx.save();
      cctx.globalAlpha = alpha;
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle = p.color;
      if(p.shape === 'rect'){
        cctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
      } else {
        cctx.beginPath();
        cctx.arc(0,0,p.size/2,0,Math.PI*2);
        cctx.fill();
      }
      cctx.restore();
    });
    confettiParticles = confettiParticles.filter(p=>p.life < p.maxLife && p.y < canvas.height+50);
    if(confettiParticles.length > 0){
      requestAnimationFrame(animateConfetti);
    } else {
      confettiRunning = false;
      cctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }

  /* ---------------- Toast ---------------- */
  let toastTimer = null;
  function showToast(msg, kind){
    toastEl.textContent = msg;
    toastEl.className = 'toast show ' + kind;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ toastEl.classList.remove('show'); }, 1400);
  }

  /* ---------------- Drag & Drop (Pointer Events) ---------------- */
  let dragEl = null;
  let ghost = null;
  let startX=0, startY=0;

  function onPointerDown(e){
    const el = e.currentTarget;
    if(el.classList.contains('collected')) return;
    ensureAudio();
    dragEl = el;
    el.classList.add('dragging');
    ghost = document.createElement('div');
    ghost.className = 'ghost';
    ghost.textContent = el.dataset.icon;
    document.body.appendChild(ghost);
    moveGhost(e.clientX, e.clientY);
    el.setPointerCapture && el.setPointerCapture(e.pointerId);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
  }

  function moveGhost(x,y){
    if(ghost){
      ghost.style.left = x + 'px';
      ghost.style.top = y + 'px';
    }
  }

  function getZoneUnder(x,y){
    const zones = [zoneLiving, zoneNonliving];
    for(const z of zones){
      const r = z.getBoundingClientRect();
      if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom){
        return z;
      }
    }
    return null;
  }

  function onPointerMove(e){
    if(!dragEl) return;
    moveGhost(e.clientX, e.clientY);
    const zone = getZoneUnder(e.clientX, e.clientY);
    [zoneLiving, zoneNonliving].forEach(z=>z.classList.toggle('hover', z===zone));
  }

  function onPointerUp(e){
    if(!dragEl) return;
    const zone = getZoneUnder(e.clientX, e.clientY);
    [zoneLiving, zoneNonliving].forEach(z=>z.classList.remove('hover'));

    if(zone){
      const correct = zone.dataset.type === dragEl.dataset.type;
      if(correct){
        handleCorrect(dragEl, zone);
      } else {
        handleWrong(dragEl);
      }
    } else {
      // dropped outside any zone -> snap back silently
    }

    if(ghost){ ghost.remove(); ghost = null; }
    dragEl.classList.remove('dragging');
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    dragEl = null;
  }

  function handleCorrect(el, zone){
    playCorrectSound();
    const rect = zone.getBoundingClientRect();
    burstConfetti(rect.left + rect.width/2, rect.top + rect.height/2);
    showToast('إجابة صحيحة! 🎉', 'good');

    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = '<span>'+el.dataset.icon+'</span><span>'+el.dataset.name+'</span>';
    (zone.dataset.type === 'living' ? chipsLiving : chipsNonliving).appendChild(chip);

    el.classList.add('collected');
    collected++;
    updateProgress();

    if(collected === totalItems){
      setTimeout(()=>{
        overlay.classList.add('show');
        const oRect = overlay.getBoundingClientRect();
        burstConfetti(window.innerWidth/2, window.innerHeight/3);
      }, 500);
    }
  }

  function handleWrong(el){
    playErrorSound();
    showToast('حاول مرة أخرى ❌', 'bad');
    el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'), 460);
  }

  function updateProgress(){
    const pct = Math.round((collected/totalItems)*100);
    progressFill.style.width = pct + '%';
    progressText.textContent = collected + ' / ' + totalItems;
  }

  document.querySelectorAll('.hotspot').forEach(el=>{
    el.addEventListener('pointerdown', onPointerDown);
  });

  /* ---------------- Restart ---------------- */
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    overlay.classList.remove('show');
    collected = 0;
    updateProgress();
    chipsLiving.innerHTML = '';
    chipsNonliving.innerHTML = '';
    document.querySelectorAll('.hotspot').forEach(el=>el.classList.remove('collected'));
  });

  updateProgress();
})();
</script>
